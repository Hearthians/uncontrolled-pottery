[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autumn-recruitment"
version = "0.1.0"
description = "Local collection and topic/sentiment study of autumn recruitment discussions"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]

[project.scripts]
autumn-recruitment = "autumn_recruitment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
